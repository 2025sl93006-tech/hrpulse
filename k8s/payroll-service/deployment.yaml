apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-service
  namespace: hrpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payroll-service
  template:
    metadata:
      labels:
        app: payroll-service
    spec:
      containers:
        - name: payroll-service
          image: abhiroop37197/payroll-service:1.0.0
          ports:
            - containerPort: 8003
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: hrpulse-config
                  key: PAYROLL_DB_URL
            - name: EMPLOYEE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: hrpulse-config
                  key: EMPLOYEE_SERVICE_URL
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: hrpulse-config
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payroll-service
  namespace: hrpulse
spec:
  selector:
    app: payroll-service
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP
