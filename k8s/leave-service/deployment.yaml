apiVersion: apps/v1
kind: Deployment
metadata:
  name: leave-service
  namespace: hrpulse
spec:
  replicas: 2   # 2 replicas — used for self-healing demo
  selector:
    matchLabels:
      app: leave-service
  template:
    metadata:
      labels:
        app: leave-service
    spec:
      containers:
        - name: leave-service
          image: abhiroop37197/leave-service:1.0.0
          ports:
            - containerPort: 8002
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: hrpulse-config
                  key: LEAVE_DB_URL
            - name: EMPLOYEE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: hrpulse-config
                  key: EMPLOYEE_SERVICE_URL
            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: hrpulse-config
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: leave-service
  namespace: hrpulse
spec:
  selector:
    app: leave-service
  ports:
    - port: 8002
      targetPort: 8002
  type: ClusterIP
