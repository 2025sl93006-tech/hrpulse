---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: hrpulse
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      upstream employee_upstream { server employee-service:8001; }
      upstream leave_upstream    { server leave-service:8002; }
      upstream payroll_upstream  { server payroll-service:8003; }
      upstream perf_upstream     { server performance-service:8004; }

      server {
        listen 80;
        location /api/employees { proxy_pass http://employee_upstream/employees; }
        location /api/org-chart  { proxy_pass http://employee_upstream/org-chart; }
        location /api/leave      { proxy_pass http://leave_upstream/leave; }
        location /api/payroll    { proxy_pass http://payroll_upstream/payroll; }
        location /api/payslip    { proxy_pass http://payroll_upstream/payslip; }
        location /api/reviews    { proxy_pass http://perf_upstream/reviews; }
        location /health {
          return 200 '{"status":"healthy","service":"gateway"}';
          add_header Content-Type application/json;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: hrpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: hrpulse
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
