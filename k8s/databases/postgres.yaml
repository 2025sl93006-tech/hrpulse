---
# Employee DB PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: employee-db-pvc
  namespace: hrpulse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-db
  namespace: hrpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-db
  template:
    metadata:
      labels:
        app: employee-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "hrpulse"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hrpulse-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "employee_db"
          volumeMounts:
            - name: storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "hrpulse", "-d", "employee_db"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "hrpulse", "-d", "employee_db"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: employee-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: employee-db
  namespace: hrpulse
spec:
  selector:
    app: employee-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
