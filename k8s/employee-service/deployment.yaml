apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service
  namespace: hrpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-service
  template:
    metadata:
      labels:
        app: employee-service
    spec:
      containers:
        - name: employee-service
          image: abhiroop37197/employee-service:1.0.0
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: hrpulse-config
                  key: EMPLOYEE_DB_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: employee-service
  namespace: hrpulse
spec:
  selector:
    app: employee-service
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
