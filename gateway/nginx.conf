events {
    worker_connections 1024;
}

http {
    upstream employee_upstream {
        server employee-service:8001;
    }
    upstream leave_upstream {
        server leave-service:8002;
    }
    upstream payroll_upstream {
        server payroll-service:8003;
    }
    upstream performance_upstream {
        server performance-service:8004;
    }

    server {
        listen 80;
        server_name _;

        location /api/employees {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://employee_upstream/employees;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/org-chart {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://employee_upstream/org-chart;
            proxy_set_header Host $host;
        }

        location /api/leave {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://leave_upstream/leave;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/payroll {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://payroll_upstream/payroll;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/payslip {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://payroll_upstream/payslip;
            proxy_set_header Host $host;
        }

        location /api/circuit-breaker {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://payroll_upstream/circuit-breaker;
            proxy_set_header Host $host;
        }

        location /api/reviews {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://performance_upstream/reviews;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header Content-Type application/json;
            return 200 '{"status":"healthy","service":"gateway"}';
        }

        location /api/health/employee {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://employee_upstream/health;
            proxy_set_header Host $host;
        }

        location /api/health/leave {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://leave_upstream/health;
            proxy_set_header Host $host;
        }

        location /api/health/payroll {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://payroll_upstream/health;
            proxy_set_header Host $host;
        }

        location /api/health/performance {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://performance_upstream/health;
            proxy_set_header Host $host;
        }
    }
}
